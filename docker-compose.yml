services:
  db:
    image: postgres:16-alpine
    container_name: finance_db
    environment:
      POSTGRES_USER: financeuser
      POSTGRES_PASSWORD: financepass
      POSTGRES_DB: finance_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financeuser -d finance_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: finance_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    image: node:20-bookworm-slim
    container_name: finance_migrate
    working_dir: /app
    command: sh -lc "corepack enable && pnpm install --frozen-lockfile && pnpm db:migrate"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_pnpm_store:/pnpm
    environment:
      - PNPM_HOME=/pnpm
      - PATH=/pnpm:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - DATABASE_URL=postgresql://financeuser:financepass@db:5432/finance_db
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend-migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: finance_backend_migrate
    command: python postgres_migration/run_all.py
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql+psycopg://financeuser:financepass@db:5432/finance_db
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: finance_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./frontend:/frontend:ro
      - frontend_node_modules:/frontend/node_modules:ro
      - frontend_uploads:/app/uploads
    environment:
      - DATABASE_URL=postgresql+psycopg://financeuser:financepass@db:5432/finance_db
      - REDIS_URL=redis://redis:6379/0
      - APP_URL=http://localhost:3000
      - FRONTEND_URL=http://localhost:3000
      - CORS_ALLOW_ORIGINS=http://localhost:3000
      - API_DOCS_ENABLED=true
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:-local-dev-internal-auth-secret}
      - DATA_ENCRYPTION_KEY_CURRENT=${DATA_ENCRYPTION_KEY_CURRENT:-}
      - DATA_ENCRYPTION_KEY_PREVIOUS=${DATA_ENCRYPTION_KEY_PREVIOUS:-}
      - DATA_ENCRYPTION_KEY_ID=${DATA_ENCRYPTION_KEY_ID:-k1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - CATEGORIZATION_LLM_MODEL=${CATEGORIZATION_LLM_MODEL:-}
      - RECEIPT_EXTRACTION_ENGINE=${RECEIPT_EXTRACTION_ENGINE:-tesseract}
      - FRONTEND_EMAILS_DIR=/frontend/emails
      - LOCAL_STORAGE_PATH=/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      backend-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()\""]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: finance_celery_worker
    command: celery -A celery_app worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-2}
    volumes:
      - ./backend:/app
      - ./frontend:/frontend:ro
      - frontend_node_modules:/frontend/node_modules:ro
      - frontend_uploads:/app/uploads
    environment:
      - DATABASE_URL=postgresql+psycopg://financeuser:financepass@db:5432/finance_db
      - REDIS_URL=redis://redis:6379/0
      - APP_URL=http://localhost:3000
      - FRONTEND_URL=http://localhost:3000
      - CORS_ALLOW_ORIGINS=http://localhost:3000
      - API_DOCS_ENABLED=true
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:-local-dev-internal-auth-secret}
      - DATA_ENCRYPTION_KEY_CURRENT=${DATA_ENCRYPTION_KEY_CURRENT:-}
      - DATA_ENCRYPTION_KEY_PREVIOUS=${DATA_ENCRYPTION_KEY_PREVIOUS:-}
      - DATA_ENCRYPTION_KEY_ID=${DATA_ENCRYPTION_KEY_ID:-k1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - CATEGORIZATION_LLM_MODEL=${CATEGORIZATION_LLM_MODEL:-}
      - RECEIPT_EXTRACTION_ENGINE=${RECEIPT_EXTRACTION_ENGINE:-tesseract}
      - FRONTEND_EMAILS_DIR=/frontend/emails
      - LOCAL_STORAGE_PATH=/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      backend-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: finance_celery_beat
    command: celery -A celery_app beat --loglevel=info
    volumes:
      - ./backend:/app
      - ./frontend:/frontend:ro
      - frontend_node_modules:/frontend/node_modules:ro
    environment:
      - DATABASE_URL=postgresql+psycopg://financeuser:financepass@db:5432/finance_db
      - REDIS_URL=redis://redis:6379/0
      - APP_URL=http://localhost:3000
      - FRONTEND_URL=http://localhost:3000
      - CORS_ALLOW_ORIGINS=http://localhost:3000
      - API_DOCS_ENABLED=true
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:-local-dev-internal-auth-secret}
      - DATA_ENCRYPTION_KEY_CURRENT=${DATA_ENCRYPTION_KEY_CURRENT:-}
      - DATA_ENCRYPTION_KEY_PREVIOUS=${DATA_ENCRYPTION_KEY_PREVIOUS:-}
      - DATA_ENCRYPTION_KEY_ID=${DATA_ENCRYPTION_KEY_ID:-k1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - CATEGORIZATION_LLM_MODEL=${CATEGORIZATION_LLM_MODEL:-}
      - FRONTEND_EMAILS_DIR=/frontend/emails
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      backend-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    image: node:20-bookworm-slim
    container_name: finance_frontend
    working_dir: /app
    command: sh -lc "corepack enable && pnpm install --frozen-lockfile && pnpm dev --hostname 0.0.0.0"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_pnpm_store:/pnpm
      - frontend_next_cache:/app/.next
      - frontend_uploads:/app/public/uploads
    environment:
      - PNPM_HOME=/pnpm
      - PATH=/pnpm:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - NODE_OPTIONS=--max-old-space-size=${FRONTEND_NODE_MEMORY_MB:-2048}
      - WATCHPACK_POLLING=true
      - DATABASE_URL=postgresql://financeuser:financepass@db:5432/finance_db
      - APP_URL=http://localhost:3000
      - BETTER_AUTH_URL=http://localhost:3000
      - NEXT_PUBLIC_BETTER_AUTH_URL=http://localhost:3000
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-local-dev-better-auth-secret}
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:-local-dev-internal-auth-secret}
      - BACKEND_URL=http://backend:8000
      - BACKEND_API_URL=http://backend:8000
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8000
      - STORAGE_PROVIDER=local
      - LOCAL_STORAGE_PATH=/app/public/uploads
      - DATA_ENCRYPTION_KEY_CURRENT=${DATA_ENCRYPTION_KEY_CURRENT:-}
      - DATA_ENCRYPTION_KEY_PREVIOUS=${DATA_ENCRYPTION_KEY_PREVIOUS:-}
      - DATA_ENCRYPTION_KEY_ID=${DATA_ENCRYPTION_KEY_ID:-k1}
      - LOGO_DEV_API_KEY=${LOGO_DEV_API_KEY:-}
      - DISABLE_SIGN_UPS=false
    depends_on:
      backend:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
  frontend_pnpm_store:
  frontend_next_cache:
  frontend_uploads:
